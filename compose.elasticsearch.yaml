name: lazytt-memory-elasticsearch-poc

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-${ES_POC_HEAP_MIN:-Xms512m} -${ES_POC_HEAP_MAX:-Xmx512m}"
    ports:
      - "127.0.0.1:${ES_POC_HOST_PORT:-19200}:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"
      interval: 5s
      timeout: 6s
      retries: 40
      start_period: 1m
    volumes:
      - elasticsearch-poc-data:/usr/share/elasticsearch/data

volumes:
  elasticsearch-poc-data:
