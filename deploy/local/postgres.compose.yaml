services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory-local-only
      POSTGRES_DB: memory
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - memory-postgres-data:/var/lib/postgresql/data
      - ../../migrations:/migrations:ro
      - ../../tests:/tests:ro

volumes:
  memory-postgres-data:
