name: lazytt-memory-pg18-elasticsearch

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lazytt_memory_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lazytt_memory}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"
      interval: 10s
      timeout: 6s
      retries: 40
      start_period: 1m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  memory-service:
    image: lazytt-memory-service:elasticsearch-local
    build:
      context: .
      dockerfile: apps/memory-service/Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MEMORY_HOST_PORT:-8080}:8080"
    environment:
      MEMORY_BIND: 0.0.0.0:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-lazytt_memory_app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-lazytt_memory}
      MEMORY_AUTH_MODE: ${MEMORY_AUTH_MODE:-trusted_user_id}
      MEMORY_ALLOW_DYNAMIC_TENANT: ${MEMORY_ALLOW_DYNAMIC_TENANT:-false}
      MEMORY_JWT_HS256_SECRET: ${MEMORY_JWT_HS256_SECRET:-}
      MEMORY_JWT_ISSUER: ${MEMORY_JWT_ISSUER:-lazytt-demo-web-api}
      MEMORY_JWT_AUDIENCE: ${MEMORY_JWT_AUDIENCE:-lazytt-memory-service}
      MEMORY_TENANT_IDS: ${MEMORY_TENANT_IDS:-demo-tenant}
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-demo-tenant}
      DEMO_USER_ID: ${DEMO_USER_ID:-semantic-demo}
      DEMO_PROJECT_ID: ${DEMO_PROJECT_ID:-lazytt-memory-system-demo}
      MEMORY_INDEX_PROVIDER: elasticsearch
      ELASTICSEARCH_BASE_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX_PREFIX: ${LOCAL_ELASTICSEARCH_INDEX_PREFIX:-lazytt-memory-migration}
      ELASTICSEARCH_REQUIRED_VERSION: 8.11.3
      MEMORY_ALLOW_INSECURE_INDEX_HTTP: "true"
      MEMORY_INDEX_TIMEOUT_SECONDS: ${MEMORY_INDEX_TIMEOUT_SECONDS:-20}
      MEMORY_EMBEDDING_PROVIDER: ${MEMORY_EMBEDDING_PROVIDER:-}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
      MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-}
      MEMORY_EMBEDDING_REVISION: ${MEMORY_EMBEDDING_REVISION:-}
      MEMORY_EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-}
      MEMORY_EMBEDDING_NORMALIZATION: ${MEMORY_EMBEDDING_NORMALIZATION:-l2}
      MEMORY_EMBEDDING_INSTRUCTION_VERSION: ${MEMORY_EMBEDDING_INSTRUCTION_VERSION:-mem0-symmetric-document-v1}
      MEMORY_EMBEDDING_SEMANTIC: "true"
      MEMORY_EMBEDDING_REQUEST_DIALECT: ${MEMORY_EMBEDDING_REQUEST_DIALECT:-openai}
      MEMORY_EMBEDDING_TIMEOUT_SECONDS: ${MEMORY_EMBEDDING_TIMEOUT_SECONDS:-30}
      MEMORY_ALLOW_INSECURE_MODEL_HTTP: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MEMORY_RERANK_MODE: ${MEMORY_RERANK_MODE:-transparent}
      MEMORY_DEDICATED_RERANK_BASE_URL: ${MEMORY_DEDICATED_RERANK_BASE_URL:-}
      MEMORY_DEDICATED_RERANK_API_KEY: ${MEMORY_DEDICATED_RERANK_API_KEY:-}
      MEMORY_DEDICATED_RERANK_MODEL: ${MEMORY_DEDICATED_RERANK_MODEL:-}
      MEMORY_DEDICATED_RERANK_REVISION: ${MEMORY_DEDICATED_RERANK_REVISION:-}
      MEMORY_DEDICATED_RERANK_DIALECT: ${MEMORY_DEDICATED_RERANK_DIALECT:-default}
      MEMORY_DEDICATED_RERANK_MINIMUM_SCORE: ${MEMORY_DEDICATED_RERANK_MINIMUM_SCORE:-0.10}
      MEMORY_DEDICATED_RERANK_TIMEOUT_SECONDS: ${MEMORY_DEDICATED_RERANK_TIMEOUT_SECONDS:-30}
      MEMORY_EXTRACT_MODE: ${MEMORY_EXTRACT_MODE:-openai_compatible}
      MEMORY_EXTRACT_API_KEY: ${MEMORY_EXTRACT_API_KEY:-${OPENAI_API_KEY:-}}
      MEMORY_EXTRACT_BASE_URL: ${MEMORY_EXTRACT_BASE_URL:-${OPENAI_BASE_URL:-}}
      MEMORY_EXTRACT_MODEL: ${MEMORY_EXTRACT_MODEL:-${OPENAI_MODEL:-}}
      KIMI_EXTRACT_API_KEY: ${KIMI_EXTRACT_API_KEY:-${KIMI_API_KEY:-}}
      KIMI_EXTRACT_BASE_URL: ${KIMI_EXTRACT_BASE_URL:-${KIMI_BASE_URL:-https://api.kimi.com/coding/v1}}
      KIMI_EXTRACT_MODEL: ${KIMI_EXTRACT_MODEL:-${KIMI_MODEL:-k3}}
      MEMORY_BOOTSTRAP_EMPTY_PROJECTION: "true"
      AUTO_MIGRATE: "true"
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 2m

volumes:
  postgres-data:
    name: lazytt-memory-pg18-simulation-data
    external: true
  elasticsearch-data:
    name: lazytt-memory-es-migration-data
    external: true
