name: lazytt-memory-pg18-elasticsearch

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lazytt_memory_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lazytt_memory}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"
      interval: 10s
      timeout: 6s
      retries: 40
      start_period: 1m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  mem0-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?set MEM0_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - mem0-postgres-data:/var/lib/postgresql/data
      - ./deploy/mem0/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

  mem0:
    image: lazytt-mem0-api-elasticsearch:b357a5a1-es-client-v1
    init: true
    restart: unless-stopped
    depends_on:
      mem0-postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      POSTGRES_HOST: mem0-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?set MEM0_POSTGRES_PASSWORD in .env}
      APP_DB_NAME: mem0_app
      HISTORY_DB_PATH: /app/history/history.db
      OPENAI_API_KEY: local-bootstrap-not-secret
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      ADMIN_API_KEY: ${MEM0_API_KEY:?set MEM0_API_KEY in .env}
      JWT_SECRET: ${MEM0_JWT_SECRET:?set MEM0_JWT_SECRET in .env}
      AUTH_DISABLED: "false"
      MEM0_TELEMETRY: "false"
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/setup-status', timeout=5).read()"
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 1m
    volumes:
      - mem0-history:/app/history

  mem0-config-elasticsearch:
    image: python:3.12-slim
    restart: "no"
    depends_on:
      mem0:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./deploy/mem0/configure.py:/configure.py:ro
    command: ["python", "/configure.py"]
    environment:
      MEM0_BASE_URL: http://mem0:8000
      MEM0_API_KEY: ${MEM0_API_KEY:?set MEM0_API_KEY in .env}
      MEM0_VECTOR_STORE_PROVIDER: elasticsearch
      MEM0_ELASTICSEARCH_HOST: http://elasticsearch
      MEM0_ELASTICSEARCH_PORT: 9200
      MEM0_ELASTICSEARCH_USER: local-elasticsearch-no-auth
      MEM0_ELASTICSEARCH_PASSWORD: local-elasticsearch-no-auth
      MEM0_ELASTICSEARCH_VERIFY_CERTS: "false"
      MEM0_COLLECTION_NAME: ${LOCAL_ELASTICSEARCH_INDEX_PREFIX:-lazytt-memory-mem0}
      EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:?set MEMORY_EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:?set MEMORY_EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:?set MEMORY_EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:?set MEMORY_EMBEDDING_DIMENSIONS}
      LLM_API_KEY: ${MEMORY_EXTRACT_API_KEY:?set MEMORY_EXTRACT_API_KEY}
      LLM_BASE_URL: ${MEMORY_EXTRACT_BASE_URL:?set MEMORY_EXTRACT_BASE_URL}
      LLM_MODEL: ${MEMORY_EXTRACT_MODEL:?set MEMORY_EXTRACT_MODEL}

  memory-service:
    image: lazytt-memory-service:mem0-elasticsearch-local
    build:
      context: .
      dockerfile: apps/memory-service/Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      mem0-config-elasticsearch:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MEMORY_HOST_PORT:-8080}:8080"
    environment:
      MEMORY_BIND: 0.0.0.0:8080
      MEMORY_BACKEND_MODE: mem0_primary
      MEMORY_AUTH_MODE: ${MEMORY_AUTH_MODE:-trusted_user_id}
      MEMORY_ALLOW_DYNAMIC_TENANT: "false"
      MEMORY_JWT_HS256_SECRET: ${MEMORY_JWT_HS256_SECRET:-}
      MEMORY_JWT_ISSUER: ${MEMORY_JWT_ISSUER:-lazytt-demo-web-api}
      MEMORY_JWT_AUDIENCE: ${MEMORY_JWT_AUDIENCE:-lazytt-memory-service}
      MEMORY_TENANT_IDS: ${MEMORY_TENANT_IDS:-demo-tenant}
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-demo-tenant}
      DEMO_USER_ID: ${DEMO_USER_ID:-semantic-demo}
      DEMO_PROJECT_ID: ${DEMO_PROJECT_ID:-lazytt-memory-system-demo}
      MEM0_BASE_URL: http://mem0:8000
      MEM0_API_KEY: ${MEM0_API_KEY:?set MEM0_API_KEY in .env}
      MEMORY_INDEX_TIMEOUT_SECONDS: ${MEMORY_INDEX_TIMEOUT_SECONDS:-120}
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 2m

volumes:
  postgres-data:
    name: lazytt-memory-pg18-simulation-data
    external: true
  elasticsearch-data:
    name: lazytt-memory-es-migration-data
    external: true
  mem0-postgres-data:
  mem0-history:
