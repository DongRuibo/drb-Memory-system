{
  "name": "lazytt-memory-local",
  "services": {
    "mem0": {
      "image": "lazytt-mem0-api-elasticsearch:b357a5a1-es-gateway-v1",
      "init": true,
      "restart": "always",
      "mem_limit": "2g",
      "cpus": 2,
      "pids_limit": 256,
      "stop_grace_period": "45s",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "command": [
        "uvicorn",
        "gateway:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ],
      "environment": {
        "POSTGRES_HOST": "${MEM0_POSTGRES_HOST:-}",
        "POSTGRES_PORT": "${MEM0_POSTGRES_PORT:-}",
        "POSTGRES_DB": "lazytt_memory_mem0",
        "APP_DB_NAME": "lazytt_memory_mem0",
        "POSTGRES_USER": "lazytt_memory_mem0_runtime",
        "POSTGRES_PASSWORD": "${MEM0_POSTGRES_RUNTIME_PASSWORD:-}",
        "HISTORY_DB_PATH": "/app/history/history.db",
        "ADMIN_API_KEY": "${MEM0_API_KEY:-}",
        "MEM0_TELEMETRY": "false"
      },
      "volumes": [
        "mem0-history:/app/history"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/setup-status', timeout=5).read()"
        ],
        "interval": "10s",
        "timeout": "8s",
        "retries": 12,
        "start_period": "30s"
      },
      "extra_hosts": [
        "host.docker.internal:host-gateway"
      ]
    },
    "memory-service": {
      "image": "lazytt-memory-service:local",
      "init": true,
      "restart": "always",
      "mem_limit": "512m",
      "cpus": 1,
      "pids_limit": 256,
      "stop_grace_period": "45s",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "ports": [
        "${LAZYTT_MEMORY_HOST_BIND:-127.0.0.1}:${LAZYTT_MEMORY_HOST_PORT:-18081}:8080",
        "127.0.0.1:${LAZYTT_MEMORY_HEALTH_PORT:-18082}:8081"
      ],
      "depends_on": {
        "mem0": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "MEMORY_BIND": "0.0.0.0:8080",
        "MEMORY_HEALTH_BIND": "0.0.0.0:8081",
        "MEMORY_BACKEND_MODE": "mem0_primary",
        "MEMORY_AUTH_MODE": "trusted_user_id",
        "MEMORY_ALLOW_DYNAMIC_TENANT": "true",
        "MEM0_BASE_URL": "http://mem0:8000",
        "MEM0_API_KEY": "${MEM0_API_KEY:-}",
        "MEMORY_INDEX_TIMEOUT_SECONDS": "120",
        "RUST_LOG": "info"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:8081/health/ready"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "30s"
      },
      "extra_hosts": [
        "host.docker.internal:host-gateway"
      ],
      "build": {
        "context": ".",
        "dockerfile": "apps/memory-service/Dockerfile"
      }
    },
    "admin": {
      "image": "lazytt-mem0-api-elasticsearch:b357a5a1-es-gateway-v1",
      "init": true,
      "restart": "no",
      "mem_limit": "512m",
      "cpus": 1,
      "pids_limit": 256,
      "stop_grace_period": "45s",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "profiles": [
        "admin"
      ],
      "environment": {
        "POSTGRES_HOST": "${MEM0_POSTGRES_HOST:-}",
        "POSTGRES_PORT": "${MEM0_POSTGRES_PORT:-}",
        "POSTGRES_DB": "lazytt_memory_mem0",
        "APP_DB_NAME": "lazytt_memory_mem0",
        "POSTGRES_USER": "lazytt_memory_mem0_runtime",
        "POSTGRES_PASSWORD": "${MEM0_POSTGRES_RUNTIME_PASSWORD:-}"
      },
      "entrypoint": [
        "python",
        "/opt/lazytt/database.py"
      ],
      "command": [
        "check"
      ],
      "extra_hosts": [
        "host.docker.internal:host-gateway"
      ]
    }
  },
  "volumes": {
    "mem0-history": {}
  },
  "networks": {
    "default": {}
  }
}
