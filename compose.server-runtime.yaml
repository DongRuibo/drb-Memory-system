name: lazytt-memory-server-runtime

services:
  mem0:
    image: lazytt-mem0-api-elasticsearch:b357a5a1-es-only-v1
    init: true
    restart: unless-stopped
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      POSTGRES_HOST: ${MEM0_POSTGRES_HOST:?set MEM0_POSTGRES_HOST}
      POSTGRES_PORT: ${MEM0_POSTGRES_PORT:-5432}
      POSTGRES_DB: ${MEM0_POSTGRES_DB:-postgres}
      POSTGRES_USER: ${MEM0_POSTGRES_RUNTIME_USER:?set MEM0_POSTGRES_RUNTIME_USER}
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_RUNTIME_PASSWORD:?set MEM0_POSTGRES_RUNTIME_PASSWORD}
      APP_DB_NAME: ${MEM0_APP_DB_NAME:-mem0_app}
      HISTORY_DB_PATH: /app/history/history.db
      OPENAI_API_KEY: local-bootstrap-not-secret
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      ADMIN_API_KEY: ${MEM0_API_KEY:?set MEM0_API_KEY}
      JWT_SECRET: ${MEM0_JWT_SECRET:?set MEM0_JWT_SECRET}
      AUTH_DISABLED: "false"
      MEM0_TELEMETRY: "false"
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/setup-status', timeout=5).read()"
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 1m
    volumes:
      - mem0-history:/app/history

  mem0-config-elasticsearch:
    image: python:3.12-slim
    restart: "no"
    depends_on:
      mem0:
        condition: service_healthy
    volumes:
      - ./deploy/mem0/configure.py:/configure.py:ro
    command: ["python", "/configure.py"]
    environment:
      MEM0_BASE_URL: http://mem0:8000
      MEM0_API_KEY: ${MEM0_API_KEY:?set MEM0_API_KEY}
      MEM0_VECTOR_STORE_PROVIDER: elasticsearch
      MEM0_ELASTICSEARCH_HOST: ${LAZYTT_MEMORY_ELASTICSEARCH_ENDPOINT:?set LAZYTT_MEMORY_ELASTICSEARCH_ENDPOINT}
      MEM0_ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
      MEM0_ELASTICSEARCH_USER: ${ELASTICSEARCH_USERNAME:-elastic}
      MEM0_ELASTICSEARCH_PASSWORD: ${STORE_ELASTICSEARCH_PASSWORD:?set STORE_ELASTICSEARCH_PASSWORD}
      MEM0_ELASTICSEARCH_VERIFY_CERTS: "false"
      MEM0_COLLECTION_NAME: ${ELASTICSEARCH_INDEX_PREFIX:-lazytt-memory-server-mem0}
      EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:?set MEMORY_EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:?set MEMORY_EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:?set MEMORY_EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:?set MEMORY_EMBEDDING_DIMENSIONS}
      LLM_API_KEY: ${MEMORY_EXTRACT_API_KEY:?set MEMORY_EXTRACT_API_KEY}
      LLM_BASE_URL: ${MEMORY_EXTRACT_BASE_URL:?set MEMORY_EXTRACT_BASE_URL}
      LLM_MODEL: ${MEMORY_EXTRACT_MODEL:?set MEMORY_EXTRACT_MODEL}

  memory-service:
    image: ${LAZYTT_MEMORY_IMAGE:?set LAZYTT_MEMORY_IMAGE}
    build:
      context: .
      dockerfile: apps/memory-service/Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      mem0-config-elasticsearch:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${LAZYTT_MEMORY_HOST_PORT:?set LAZYTT_MEMORY_HOST_PORT}:8080"
    environment:
      MEMORY_BIND: 0.0.0.0:8080
      MEMORY_BACKEND_MODE: mem0_primary
      MEMORY_AUTH_MODE: ${MEMORY_AUTH_MODE:-trusted_user_id}
      MEMORY_ALLOW_DYNAMIC_TENANT: "false"
      MEMORY_JWT_HS256_SECRET: ${MEMORY_JWT_HS256_SECRET:-}
      MEMORY_JWT_ISSUER: ${MEMORY_JWT_ISSUER:-lazytt-demo-web-api}
      MEMORY_JWT_AUDIENCE: ${MEMORY_JWT_AUDIENCE:-lazytt-memory-service}
      MEMORY_TENANT_IDS: ${MEMORY_TENANT_IDS:-}
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-demo-tenant}
      DEMO_USER_ID: ${DEMO_USER_ID:-semantic-demo}
      DEMO_PROJECT_ID: ${DEMO_PROJECT_ID:-lazytt-memory-system-demo}
      MEM0_BASE_URL: http://mem0:8000
      MEM0_API_KEY: ${MEM0_API_KEY:?set MEM0_API_KEY}
      MEMORY_INDEX_TIMEOUT_SECONDS: ${MEMORY_INDEX_TIMEOUT_SECONDS:-120}
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 2m

networks:
  default:
    name: ${LAZYTT_MEMORY_DATA_NETWORK:?set LAZYTT_MEMORY_DATA_NETWORK}
    external: true

volumes:
  mem0-history:
