[workspace]
resolver = "2"
members = [
    "crates/memory-domain",
    "crates/memory-application",
    "crates/memory-client",
    "crates/memory-postgres",
    "crates/provider-adapters/elasticsearch-adapter",
    "crates/provider-adapters/mem0-adapter",
    "crates/extractors/kimi-extractor",
    "crates/rerankers/kimi-reranker",
    "crates/rerankers/http-reranker",
    "apps/memory-service",
    "apps/demo-agent",
    "apps/demo-web-api",
    "apps/poc-cli",
    "apps/retrieval-eval",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
hex = "0.4.3"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
hmac = "0.12.1"
jieba-rs = "0.7.4"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.18.1", features = ["serde", "v4", "v5"] }
