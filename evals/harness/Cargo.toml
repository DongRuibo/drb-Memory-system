[package]
name = "memory-eval-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# 独立工作区，不改动已有未提交的根 Cargo 配置。
[workspace]

[dependencies]
memory-application = { path = "../../crates/memory-application" }
memory-postgres = { path = "../../crates/memory-postgres" }
chrono = "0.4.42"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
uuid = { version = "1.18.1", features = ["v4", "v5"] }
