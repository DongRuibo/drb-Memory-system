name: lazytt-memory-backend

x-model-environment: &model-environment
  MEMORY_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
  MEMORY_EMBEDDING_REVISION: ${LOCAL_EMBEDDING_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
  MEMORY_EMBEDDING_DIMENSIONS: ${LOCAL_EMBEDDING_DIMENSIONS:-1024}
  MEMORY_DEDICATED_RERANK_MODEL: ${LOCAL_RERANK_MODEL:-Qwen/Qwen3-Reranker-0.6B}
  MEMORY_DEDICATED_RERANK_REVISION: ${LOCAL_RERANK_REVISION:-e61197e}
  RETRIEVAL_MODELS_HOST: 0.0.0.0
  RETRIEVAL_MODELS_PORT: 18082
  RETRIEVAL_MODELS_MAX_LENGTH: ${RETRIEVAL_MODELS_MAX_LENGTH:-4096}
  HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
  HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-60}
  HF_HUB_ETAG_TIMEOUT: ${HF_HUB_ETAG_TIMEOUT:-30}

x-model-healthcheck: &model-healthcheck
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18082/health', timeout=5).read()"
  interval: 15s
  timeout: 8s
  retries: 40
  start_period: 10m

x-mem0-config-environment: &mem0-config-environment
  MEM0_BASE_URL: http://mem0:8000
  MEM0_API_KEY: ${MEM0_API_KEY:?run ./scripts/bootstrap-backend-env.sh}
  MEM0_POSTGRES_HOST: mem0-postgres
  MEM0_POSTGRES_PORT: 5432
  MEM0_POSTGRES_DB: postgres
  MEM0_POSTGRES_USER: mem0
  MEM0_POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?run ./scripts/bootstrap-backend-env.sh}
  MEM0_COLLECTION_NAME: ${MEM0_COLLECTION_NAME:-memories_qwen3_1024}

x-memory-service-environment: &memory-service-environment
  MEMORY_BIND: 0.0.0.0:8080
  DATABASE_URL: ${MEMORY_DATABASE_URL:-postgres://memory:${MEMORY_POSTGRES_PASSWORD:?run ./scripts/bootstrap-backend-env.sh}@postgres:5432/memory}
  MEM0_BASE_URL: http://mem0:8000
  MEM0_API_KEY: ${MEM0_API_KEY:?run ./scripts/bootstrap-backend-env.sh}
  MEMORY_AUTH_MODE: ${MEMORY_AUTH_MODE:-jwt_hs256}
  MEMORY_ALLOW_DYNAMIC_TENANT: ${MEMORY_ALLOW_DYNAMIC_TENANT:-false}
  MEMORY_JWT_HS256_SECRET: ${MEMORY_JWT_HS256_SECRET:-}
  MEMORY_JWT_ISSUER: ${MEMORY_JWT_ISSUER:-lazytt-demo-web-api}
  MEMORY_JWT_AUDIENCE: ${MEMORY_JWT_AUDIENCE:-lazytt-memory-service}
  MEMORY_TENANT_IDS: ${MEMORY_TENANT_IDS:-demo-tenant}
  DEMO_TENANT_ID: ${DEMO_TENANT_ID:-demo-tenant}
  DEMO_USER_ID: ${DEMO_USER_ID:-semantic-demo}
  DEMO_PROJECT_ID: ${DEMO_PROJECT_ID:-lazytt-memory-system-demo}
  MEMORY_EXTRACT_MODE: ${MEMORY_EXTRACT_MODE:-openai_compatible}
  MEMORY_EXTRACT_API_KEY: ${MEMORY_EXTRACT_API_KEY:-${OPENAI_API_KEY:-}}
  MEMORY_EXTRACT_BASE_URL: ${MEMORY_EXTRACT_BASE_URL:-${OPENAI_BASE_URL:-${base_url:-}}}
  MEMORY_EXTRACT_MODEL: ${MEMORY_EXTRACT_MODEL:-${OPENAI_MODEL:-${model_name:-}}}
  KIMI_EXTRACT_API_KEY: ${KIMI_EXTRACT_API_KEY:-${KIMI_API_KEY:-${apikey:-}}}
  KIMI_EXTRACT_BASE_URL: ${KIMI_EXTRACT_BASE_URL:-${KIMI_BASE_URL:-${base_url:-https://api.kimi.com/coding/v1}}}
  KIMI_EXTRACT_MODEL: ${KIMI_EXTRACT_MODEL:-${KIMI_MODEL:-${model_name:-k3}}}
  MEMORY_RERANK_MODE: dedicated
  MEMORY_EMBEDDING_SEMANTIC: "true"
  MEMORY_EMBEDDING_NORMALIZATION: l2
  MEMORY_EMBEDDING_INSTRUCTION_VERSION: mem0-symmetric-document-v1
  MEMORY_BOOTSTRAP_EMPTY_PROJECTION: "true"
  AUTO_MIGRATE: "true"
  RUST_LOG: ${RUST_LOG:-info}

x-memory-service: &memory-service
  image: lazytt-memory-service:local
  build:
    context: .
    dockerfile: apps/memory-service/Dockerfile
  init: true
  restart: unless-stopped
  ports:
    - "${MEMORY_HOST_BIND:-127.0.0.1}:${MEMORY_HOST_PORT:-8080}:8080"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 2m

x-mem0-configurator: &mem0-configurator
  image: python:3.12-slim
  restart: "no"
  volumes:
    - ./deploy/mem0/configure.py:/configure.py:ro
  command: ["python", "/configure.py"]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${MEMORY_POSTGRES_PASSWORD:?run ./scripts/bootstrap-backend-env.sh}
      POSTGRES_DB: memory
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - memory-postgres-data:/var/lib/postgresql/data

  mem0-postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?run ./scripts/bootstrap-backend-env.sh}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - mem0-postgres-data:/var/lib/postgresql/data
      - ./deploy/mem0/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

  mem0:
    image: lazytt-mem0-api:b357a5a1
    build:
      context: https://github.com/mem0ai/mem0.git#b357a5a1b03c299ec8229c268e63cfac0f7c6566
      dockerfile: server/dev.Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      mem0-postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      POSTGRES_HOST: mem0-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?run ./scripts/bootstrap-backend-env.sh}
      APP_DB_NAME: mem0_app
      HISTORY_DB_PATH: /app/history/history.db
      OPENAI_API_KEY: local-bootstrap-not-secret
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      ADMIN_API_KEY: ${MEM0_API_KEY:?run ./scripts/bootstrap-backend-env.sh}
      JWT_SECRET: ${MEM0_JWT_SECRET:?run ./scripts/bootstrap-backend-env.sh}
      AUTH_DISABLED: "false"
      MEM0_TELEMETRY: "false"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${MEM0_HOST_PORT:-18888}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/setup-status', timeout=5).read()"
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 1m
    volumes:
      - mem0-history:/app/history

  retrieval-models-cpu:
    profiles: ["cpu"]
    image: lazytt-retrieval-models:cpu
    build:
      context: .
      dockerfile: deploy/models/Dockerfile.cpu
    init: true
    restart: unless-stopped
    environment:
      <<: *model-environment
      RETRIEVAL_MODELS_DEVICE: cpu
    ports:
      - "127.0.0.1:${RETRIEVAL_MODELS_HOST_PORT:-18082}:18082"
    healthcheck: *model-healthcheck
    volumes:
      - retrieval-model-cache:/models/huggingface

  retrieval-models-cuda:
    profiles: ["cuda"]
    platform: linux/amd64
    image: lazytt-retrieval-models:cuda
    build:
      context: .
      dockerfile: deploy/models/Dockerfile.cuda
    init: true
    restart: unless-stopped
    gpus: all
    environment:
      <<: *model-environment
      RETRIEVAL_MODELS_DEVICE: cuda
    ports:
      - "127.0.0.1:${RETRIEVAL_MODELS_HOST_PORT:-18082}:18082"
    healthcheck: *model-healthcheck
    volumes:
      - retrieval-model-cache:/models/huggingface

  mem0-config-cpu:
    <<: *mem0-configurator
    profiles: ["cpu"]
    depends_on:
      mem0:
        condition: service_healthy
      retrieval-models-cpu:
        condition: service_healthy
    environment:
      <<: *mem0-config-environment
      EMBEDDING_BASE_URL: http://retrieval-models-cpu:18082
      EMBEDDING_API_KEY: local-model-no-secret
      EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSIONS: ${LOCAL_EMBEDDING_DIMENSIONS:-1024}

  mem0-config-cuda:
    <<: *mem0-configurator
    profiles: ["cuda"]
    depends_on:
      mem0:
        condition: service_healthy
      retrieval-models-cuda:
        condition: service_healthy
    environment:
      <<: *mem0-config-environment
      EMBEDDING_BASE_URL: http://retrieval-models-cuda:18082
      EMBEDDING_API_KEY: local-model-no-secret
      EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSIONS: ${LOCAL_EMBEDDING_DIMENSIONS:-1024}

  mem0-config-host-mps:
    <<: *mem0-configurator
    profiles: ["host-mps"]
    depends_on:
      mem0:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *mem0-config-environment
      EMBEDDING_BASE_URL: http://host.docker.internal:${LOCAL_RETRIEVAL_MODELS_PORT:-18082}
      EMBEDDING_API_KEY: local-model-no-secret
      EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSIONS: ${LOCAL_EMBEDDING_DIMENSIONS:-1024}

  mem0-config-cloud:
    <<: *mem0-configurator
    profiles: ["cloud"]
    depends_on:
      mem0:
        condition: service_healthy
    environment:
      <<: *mem0-config-environment
      EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-}

  memory-service-cpu:
    <<: *memory-service
    profiles: ["cpu"]
    depends_on:
      postgres:
        condition: service_healthy
      mem0-config-cpu:
        condition: service_completed_successfully
      retrieval-models-cpu:
        condition: service_healthy
    environment:
      <<: *memory-service-environment
      MEMORY_EMBEDDING_PROVIDER: local-qwen
      MEMORY_EMBEDDING_BASE_URL: http://retrieval-models-cpu:18082
      MEMORY_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      MEMORY_EMBEDDING_REVISION: ${LOCAL_EMBEDDING_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
      MEMORY_EMBEDDING_DIMENSIONS: ${LOCAL_EMBEDDING_DIMENSIONS:-1024}
      MEMORY_EMBEDDING_REQUEST_DIALECT: lazytt
      MEMORY_DEDICATED_RERANK_BASE_URL: http://retrieval-models-cpu:18082
      MEMORY_DEDICATED_RERANK_MODEL: ${LOCAL_RERANK_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      MEMORY_DEDICATED_RERANK_REVISION: ${LOCAL_RERANK_REVISION:-e61197e}
      MEMORY_DEDICATED_RERANK_RESPONSE_MODEL_REQUIRED: "true"
      MEMORY_ALLOW_INSECURE_MODEL_HTTP: "true"

  memory-service-cuda:
    <<: *memory-service
    profiles: ["cuda"]
    depends_on:
      postgres:
        condition: service_healthy
      mem0-config-cuda:
        condition: service_completed_successfully
      retrieval-models-cuda:
        condition: service_healthy
    environment:
      <<: *memory-service-environment
      MEMORY_EMBEDDING_PROVIDER: local-qwen
      MEMORY_EMBEDDING_BASE_URL: http://retrieval-models-cuda:18082
      MEMORY_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      MEMORY_EMBEDDING_REVISION: ${LOCAL_EMBEDDING_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
      MEMORY_EMBEDDING_DIMENSIONS: ${LOCAL_EMBEDDING_DIMENSIONS:-1024}
      MEMORY_EMBEDDING_REQUEST_DIALECT: lazytt
      MEMORY_DEDICATED_RERANK_BASE_URL: http://retrieval-models-cuda:18082
      MEMORY_DEDICATED_RERANK_MODEL: ${LOCAL_RERANK_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      MEMORY_DEDICATED_RERANK_REVISION: ${LOCAL_RERANK_REVISION:-e61197e}
      MEMORY_DEDICATED_RERANK_RESPONSE_MODEL_REQUIRED: "true"
      MEMORY_ALLOW_INSECURE_MODEL_HTTP: "true"

  memory-service-host-mps:
    <<: *memory-service
    profiles: ["host-mps"]
    depends_on:
      postgres:
        condition: service_healthy
      mem0-config-host-mps:
        condition: service_completed_successfully
    environment:
      <<: *memory-service-environment
      MEMORY_EMBEDDING_PROVIDER: local-qwen
      MEMORY_EMBEDDING_BASE_URL: http://host.docker.internal:18082
      MEMORY_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      MEMORY_EMBEDDING_REVISION: ${LOCAL_EMBEDDING_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
      MEMORY_EMBEDDING_DIMENSIONS: ${LOCAL_EMBEDDING_DIMENSIONS:-1024}
      MEMORY_EMBEDDING_REQUEST_DIALECT: lazytt
      MEMORY_DEDICATED_RERANK_BASE_URL: http://host.docker.internal:18082
      MEMORY_DEDICATED_RERANK_MODEL: ${LOCAL_RERANK_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      MEMORY_DEDICATED_RERANK_REVISION: ${LOCAL_RERANK_REVISION:-e61197e}
      MEMORY_DEDICATED_RERANK_RESPONSE_MODEL_REQUIRED: "true"
      MEMORY_ALLOW_INSECURE_MODEL_HTTP: "true"

  memory-service-cloud:
    <<: *memory-service
    profiles: ["cloud"]
    depends_on:
      postgres:
        condition: service_healthy
      mem0-config-cloud:
        condition: service_completed_successfully
    environment:
      <<: *memory-service-environment
      MEMORY_EMBEDDING_PROVIDER: ${MEMORY_EMBEDDING_PROVIDER:-}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
      MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-}
      MEMORY_EMBEDDING_REVISION: ${MEMORY_EMBEDDING_REVISION:-}
      MEMORY_EMBEDDING_DIMENSIONS: ${MEMORY_EMBEDDING_DIMENSIONS:-}
      MEMORY_EMBEDDING_REQUEST_DIALECT: openai
      MEMORY_DEDICATED_RERANK_BASE_URL: ${MEMORY_DEDICATED_RERANK_BASE_URL:-}
      MEMORY_DEDICATED_RERANK_API_KEY: ${MEMORY_DEDICATED_RERANK_API_KEY:-}
      MEMORY_DEDICATED_RERANK_MODEL: ${MEMORY_DEDICATED_RERANK_MODEL:-}
      MEMORY_DEDICATED_RERANK_REVISION: ${MEMORY_DEDICATED_RERANK_REVISION:-}
      MEMORY_DEDICATED_RERANK_MINIMUM_SCORE: ${MEMORY_DEDICATED_RERANK_MINIMUM_SCORE:-0.10}
      MEMORY_DEDICATED_RERANK_TIMEOUT_SECONDS: ${MEMORY_DEDICATED_RERANK_TIMEOUT_SECONDS:-30}
      MEMORY_DEDICATED_RERANK_RESPONSE_MODEL_REQUIRED: "false"
      MEMORY_ALLOW_INSECURE_MODEL_HTTP: "false"

volumes:
  memory-postgres-data:
  mem0-postgres-data:
  mem0-history:
  retrieval-model-cache:
